    sex = "M"
    divisions = ["Youth 1","Youth 2","Youth 3","SO Youth 1","SO Youth 2","SO Youth 3"]

[weightclasses.youth_F]
    classes = ["30","35","40","43","47","52","57","63","69","76","84","84+"]
